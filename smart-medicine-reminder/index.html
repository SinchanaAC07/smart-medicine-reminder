<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Medicine Reminder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>💊 Smart Medicine Reminder</h1>
        <p>Track your medicines and never miss a dose.</p>
    </header>

    <main>
        <section class="dashboard">

    <div class="summary">
        <h3>Total</h3>
        <p id="totalCount">0</p>
    </div>

    <div class="summary">
        <h3>✅ Taken</h3>
        <p id="takenCount">0</p>
    </div>

    <div class="summary">
        <h3>❌ Missed</h3>
        <p id="missedCount">0</p>
    </div>

    <div class="summary">
        <h3>⏳ Pending</h3>
        <p id="pendingCount">0</p>
    </div>

</section>

        <section class="card">
            <h2>➕ Add Medicine</h2>

            <label>Medicine Name</label>
            <input type="text" id="medicineName"
                   placeholder="Enter medicine name">

            <label>Medicine Time</label>
            <input type="time" id="medicineTime">
            <label>Medicine Date</label>
            <input type="date" id="medicineDate">

            <button onclick="addMedicine()">Add Medicine</button>
        </section>


        <section class="card">
            <h2>💊 Today's Medicines</h2>

            <div id="medicineList">
                <p>No medicines added yet.</p>
            </div>

        </section>
        <section class="card">
    <h2>📊 Medicine History</h2>
    <input
    type="text"
    id="historySearch"
    placeholder="🔎 Search medicine..."
    oninput="searchHistory()"
>

   <div class="history-filters">
    <button onclick="filterHistory('All')">All</button>
    <button onclick="filterHistory('Today')">📅 Today</button>
    <button onclick="filterHistory('Pending')">⏳ Pending</button>
    <button onclick="filterHistory('Taken')">✅ Taken</button>
    <button onclick="filterHistory('Missed')">❌ Missed</button>
</div>

    <div id="historyList">
        <p>No history available yet.</p>
    </div>
</section>

    </main>
    

    <script src="script.js"></script>

</body>
</html>
